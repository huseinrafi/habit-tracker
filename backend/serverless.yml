service: habit-tracker-backend

provider:
  name: aws
  runtime: nodejs22.x
  stage: dev
  region: us-east-1
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: ${self:provider.stage}
    USERS_TABLE: HabitTracker_Users
    TASKS_TABLE: HabitTracker_Tasks
    HABITS_TABLE: HabitTracker_Habits
    HABIT_LOGS_TABLE: HabitTracker_Logs

package:
  individually: false
  patterns:
    - '!test/**'
    - '!.git/**'

functions:
  api:
    handler: src/app.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
      - httpApi:
          path: /
          method: '*'

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true
