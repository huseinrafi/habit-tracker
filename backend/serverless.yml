service: habit-tracker-backend

provider:
  name: aws
  runtime: nodejs22.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 512
  timeout: 29
  environment:
    NODE_ENV: ${self:provider.stage}
    AWS_REGION: ${self:provider.region}
    USERS_TABLE: HabitTracker_Users
    TASKS_TABLE: HabitTracker_Tasks
    HABITS_TABLE: HabitTracker_Habits
    HABIT_LOGS_TABLE: HabitTracker_Logs
    ATTACHMENTS_BUCKET: habit-tracker-attachments-${self:provider.stage}
  apiGateway:
    binaryMediaTypes:
      - '*/*'
      - 'image/*'
      - 'multipart/form-data'
  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:Query
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:BatchWriteItem
          Resource:
            - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HabitTracker_*
            - !Sub arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/HabitTracker_*/index/*
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
            - s3:PutObjectAcl
          Resource: !Sub arn:aws:s3:::${AttachmentsBucket}/*

package:
  individually: true
  patterns:
    - '!prisma/**'
    - '!data/**'
    - '!public/**'
    - '!scripts/**'
    - '!test/**'
    - '!.git/**'

functions:
  api:
    handler: src/app.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
      - httpApi:
          path: /
          method: '*'

plugins:
  - serverless-offline

custom:
  serverless-offline:
    httpPort: 3001
    noPrependStageInUrl: true

resources:
  Resources:
    UsersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: HabitTracker_Users
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: email-index
            KeySchema:
              - AttributeName: email
                KeyType: HASH
            Projection:
              ProjectionType: KEYS_ONLY
        BillingMode: PAY_PER_REQUEST

    TasksTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: HabitTracker_Tasks
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: taskId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: taskId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    HabitsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: HabitTracker_Habits
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: habitId
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: habitId
            KeyType: RANGE
        BillingMode: PAY_PER_REQUEST

    HabitLogsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: HabitTracker_Logs
        AttributeDefinitions:
          - AttributeName: habitId
            AttributeType: S
          - AttributeName: dateCompleted#logId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: dateCompleted
            AttributeType: S
        KeySchema:
          - AttributeName: habitId
            KeyType: HASH
          - AttributeName: dateCompleted#logId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: userId-date-index
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: dateCompleted
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
        BillingMode: PAY_PER_REQUEST

    AttachmentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: !Sub habit-tracker-attachments-${AWS::AccountId}-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST]
              AllowedOrigins:
                - !Sub http://${WebBucket}.s3-website-${AWS::Region}.amazonaws.com
              ExposeHeaders: [ETag]

    WebBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: !Sub habit-tracker-web-${AWS::AccountId}-${self:provider.stage}
        WebsiteConfiguration:
          IndexDocument: index.html
          ErrorDocument: index.html
        PublicAccessBlockConfiguration:
          BlockPublicAcls: false
          BlockPublicPolicy: false
          IgnorePublicAcls: false
          RestrictPublicBuckets: false

    WebBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebBucket
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Principal: '*'
              Action: s3:GetObject
              Resource: !Sub arn:aws:s3:::${WebBucket}/*

outputs:
  ApiUrl:
    Description: API Gateway URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  WebBucketUrl:
    Description: S3 Website URL
    Value: !Sub http://${WebBucket}.s3-website-${AWS::Region}.amazonaws.com
  AttachmentsBucketName:
    Description: S3 Attachments bucket name
    Value: !Ref AttachmentsBucket
