service: habit-tracker-backend

provider:
  name: aws
  runtime: nodejs20.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, 'ap-southeast-1'}
  memorySize: 512
  timeout: 29  # API Gateway max is 29s
  
  # 1. AKTIFKAN CORS GLOBAL UNTUK httpApi DI SINI
  httpApi:
    cors:
      allowedOrigins:
        - http://localhost:5173
        - http://localhost:5174
        - http://192.168.1.160:5174  # Mengizinkan IP LAN Anda yang ada di log
      allowedHeaders:
        - Content-Type
        - Authorization
      allowedMethods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
      allowCredentials: true
    binaryMediaTypes:
      - '*/*'
      - 'image/*'
      - 'multipart/form-data'

  environment:
    NODE_ENV: ${self:provider.stage}
    # 2. JIKA MENGGUNAKAN DYNAMODB, SERINGKALI ANDA BUTUH NAMA TABEL SEBAGAI ENV
    # HABITS_TABLE: habit-tracker-habits-${self:provider.stage}
    # USERS_TABLE: habit-tracker-users-${self:provider.stage}

# ─── Packaging ──────────────────────────────────────────────────────────────
package:
  individually: true
  patterns:
    - '!node_modules/.prisma/client/libquery_engine-*'
    - 'node_modules/.prisma/client/libquery_engine-rhel-*'  # Lambda runtime engine
    - '!node_modules/prisma/libquery_engine-*'
    - '!node_modules/@prisma/engines/**'
    - '!test/**'
    - '!data/**'
    - '!.git/**'

functions:
  api:
    handler: src/app.handler
    events:
      - httpApi:
          path: /{proxy+}
          method: '*'
      - httpApi:
          path: /
          method: '*'

plugins:
  - serverless-offline  # for local development

custom:
  serverless-offline:
    httpPort: 3000
    noPrependStageInUrl: true